name: NovaOps Email Integration Test

on:
  workflow_dispatch:

jobs:
  email-integration-test:
    name: Real Email Integration Test
    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run controlled real email test
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"

          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}

          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

        run: |
          pytest -v -m "email_integration" tests/test_email_integration.py
