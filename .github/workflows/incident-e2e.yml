name: NovaOps Incident E2E Test

on:
  workflow_dispatch:

jobs:
  incident-e2e-test:
    name: Real Incident Lifecycle Test
    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run real incident lifecycle test
        env:
          NOVAOPS_SIMULATOR_URL: ${{ secrets.NOVAOPS_SIMULATOR_URL }}

          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"

          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}

          DATABASE_URL: sqlite:///./novaops-e2e.db

        run: |
          pytest -v -s -m "e2e" tests/test_incident_e2e.py
