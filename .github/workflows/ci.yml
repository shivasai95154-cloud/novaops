name: NovaOps CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - "feature/**"

  pull_request:
    branches:
      - main


jobs:

  # -------------------------------------------------
  # UNIT TESTS
  # -------------------------------------------------

  unit-tests:

    name: Unit Tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -v -m "not integration and not email_integration and not e2e"


  # -------------------------------------------------
  # DEV INTEGRATION TESTS
  # -------------------------------------------------

  integration-tests:

    name: DEV Integration Tests

    runs-on: ubuntu-latest

    env:
      NOVAOPS_SIMULATOR_URL: ${{ vars.NOVAOPS_SIMULATOR_URL }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run DEV integration tests
        run: |
          pytest -v -m "integration and not email_integration and not e2e"
